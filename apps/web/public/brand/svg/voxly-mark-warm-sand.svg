  <title id="title">Voxly warm sand alternate mark</title>
  <desc id="desc">Voxly V mark with exactly five independent vertical voice bars, using the canonical geometry and an alternate monochrome palette.</desc>
  <defs><linearGradient id="voxly-warm-sand" x1="0" y1="1" x2="1" y2="0">        <stop offset="0%" stop-color="#F5F3EF"/>
        <stop offset="50%" stop-color="#D6D1CA"/>
        <stop offset="100%" stop-color="#9A958D"/>
      </linearGradient></defs>
      <path id="voxly-v" d="M 110 125 L 235 360 L 335 245" fill="none" stroke="url(#voxly-warm-sand)" stroke-width="94" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="voice-bars" fill="url(#voxly-warm-sand)" shape-rendering="geometricPrecision">
        <rect x="282" y="116" width="26" height="56" rx="13"/>
        <rect x="322" y="98" width="26" height="92" rx="13"/>
        <rect x="362" y="80" width="26" height="128" rx="13"/>
