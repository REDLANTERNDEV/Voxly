name: Windows desktop feasibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: npm ci
      - run: npm run typecheck -w @voxly/desktop
      - run: npm run test -w @voxly/desktop
      - run: npm run build -w @voxly/desktop
      - name: Verify native shell
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build test installer
        run: npm run desktop:build
      - name: Check whitespace
        run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: voxly-windows-feasibility-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
