# turn.example.com must resolve directly to this host, without an HTTP proxy.
# Keep TURN as WebRTC fallback. Prefer browser-to-browser P2P when ICE can connect.

realm=turn.example.com
server-name=turn.example.com
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
# REQUIRED: add static-auth-secret with at least 32 random bytes. This tracked
# example intentionally contains no working shared-secret default.

# Restrict relay ports to the deployment's firewall-friendly range for a private group.
min-port=49160
max-port=50160
user-quota=50
total-quota=1000

# Loopback peers remain blocked by Coturn's secure default. Do not add
# allow-loopback-peers on an internet-facing server.
no-multicast-peers

# Every Voxly account receives relay credentials, so refuse relays to private,
# link-local (cloud metadata), CGNAT and reserved addresses. Real peers are
# reached at public or relay addresses. Keep in step with infra/start-coturn.sh.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-cli

# Do not log verbose media/session details by default.
simple-log
new-log-timestamp
log-file=stdout

# Set these on the host.
# external-ip=203.0.113.10
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
