[package]
name = "voxly-desktop"
version = "0.1.0"
description = "Windows-first Voxly desktop feasibility client"
edition = "2021"
rust-version = "1.98"
publish = false

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-opener = "~2.5"
tauri-plugin-single-instance = "~2.4"
tauri-plugin-global-shortcut = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["Win32_Foundation"] }
webview2-com = "=0.38.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
