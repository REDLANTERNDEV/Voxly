name: voxly

services:
  app:
    build:
      context: .
      target: runtime
    image: voxly/app:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/voxly.sqlite
      WEB_DIST_PATH: /app/apps/web/dist
      VOXLY_PUBLIC_URL: ${VOXLY_PUBLIC_URL:-http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
      ENABLE_HTTP_OWNER_BOOTSTRAP: ${ENABLE_HTTP_OWNER_BOOTSTRAP:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${VOXLY_HTTP_PORT:-3000}:3000"
    volumes:
      - voxly_data:/data
    networks:
      - voxly_bridge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${VOXLY_APP_MEMORY_LIMIT:-384m}
    mem_reservation: ${VOXLY_APP_MEMORY_RESERVATION:-160m}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/me').then((r)=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  coturn:
    image: coturn/coturn:4.6.3
    profiles:
      - turn
    restart: unless-stopped
    network_mode: host
    command:
      - --realm=${TURN_REALM:-turn.example.com}
      - --server-name=${TURN_REALM:-turn.example.com}
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:-replace-with-long-random-secret}
      - --min-port=${TURN_MIN_PORT:-49160}
      - --max-port=${TURN_MAX_PORT:-49200}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --no-stdout-log
      - --simple-log
      - --no-cli
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${VOXLY_TURN_MEMORY_LIMIT:-128m}
    mem_reservation: ${VOXLY_TURN_MEMORY_RESERVATION:-32m}

networks:
  voxly_bridge:
    driver: bridge

volumes:
  voxly_data:
