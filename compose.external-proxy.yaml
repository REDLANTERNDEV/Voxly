name: voxly

# Use this file instead of compose.yaml when the HTTPS reverse proxy runs as a
# container managed outside this project (Dokploy, Coolify, CapRover, or a
# hand-run Traefik/nginx-proxy). Such a proxy cannot reach a loopback-published
# host port, so the app joins the proxy's existing Docker network instead.
# Set PROXY_NETWORK to that network's name; it must already exist.
#
# When the proxy runs on the host itself (Nginx or Caddy installed on the VM),
# use compose.yaml instead.

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/voxly.sqlite
      WEB_DIST_PATH: /app/apps/web/dist
      VOXLY_PUBLIC_URL: ${VOXLY_PUBLIC_URL:?VOXLY_PUBLIC_URL is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      OWNER_BOOTSTRAP_TOKEN: ${OWNER_BOOTSTRAP_TOKEN:-}
      ENABLE_HTTP_OWNER_BOOTSTRAP: ${ENABLE_HTTP_OWNER_BOOTSTRAP:-false}
      VOXLY_BOT_TOKEN: ${VOXLY_BOT_TOKEN:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-}
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      ANALYTICS_HOST_URL: ${ANALYTICS_HOST_URL:-}
      TURN_REALM: ${TURN_REALM:-}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-86400}
    expose:
      - "3000"
    volumes:
      - voxly_data:/data
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${VOXLY_APP_MEMORY_LIMIT:-384m}
    mem_reservation: ${VOXLY_APP_MEMORY_RESERVATION:-160m}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok ? 0 : 1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The Music bot, deliberately its own service rather than a second process
  # beside the application. It is a client of the application's public HTTP and
  # Socket.IO surface exactly as a browser is, so it restarts on its own and a
  # music problem never takes chat and voice down with it. ADR-0012.
  #
  # Opt-in, because a deployment that leaves VOXLY_BOT_TOKEN blank is a
  # supported one: the bot accounts still appear in every member list, offline.
  # Enable it with `COMPOSE_PROFILES=music` in `.env`, or with
  # `--profile music` on the command line.
  bot:
    profiles:
      - music
    build:
      context: .
      target: bot
      args:
        # Raising this and rebuilding is the whole repair when YouTube changes
        # how it serves video. See docs/self-hosting.md.
        VOXLY_YTDLP_VERSION: ${VOXLY_YTDLP_VERSION:-2026.08.19}
    restart: unless-stopped
    # Two subprocesses per Track, killed mid-sentence by every skip. Without an
    # init the bot accumulates zombies for the lifetime of the container.
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The application over the internal bridge, not through the public proxy:
      # the round trip out and back exists only to arrive where this already is.
      # Override it when the bot runs somewhere the service name does not
      # resolve.
      VOXLY_SERVER_URL: ${VOXLY_SERVER_URL:-http://app:3000}
      # The same credential the application holds, presented from the other
      # side of the exchange. ADR-0003.
      VOXLY_BOT_TOKEN: ${VOXLY_BOT_TOKEN:-}
      VOXLY_YTDLP_CLIENT: ${VOXLY_YTDLP_CLIENT:-}
    networks:
      - proxy
    read_only: true
    # Sized for yt-dlp's own scratch use rather than for a Track. The audio path
    # is a pipe into ffmpeg and nothing is written to disk, so this holds no
    # music however long the Track is.
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${VOXLY_BOT_MEMORY_LIMIT:-320m}
    mem_reservation: ${VOXLY_BOT_MEMORY_RESERVATION:-128m}

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-dokploy-network}

volumes:
  voxly_data:
