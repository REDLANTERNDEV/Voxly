# turn.voxly.example.com should be DNS-only in Cloudflare, not proxied.
# Keep TURN as WebRTC fallback. Prefer browser-to-browser P2P when ICE can connect.

realm=turn.voxly.example.com
server-name=turn.voxly.example.com
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=replace-with-long-random-secret

# Restrict relay ports to a small firewall-friendly range for a private group.
min-port=49160
max-port=49200

# Do not log verbose media/session details by default.
no-stdout-log
simple-log

# Set these on the VPS.
# external-ip=PUBLIC_VPS_IP
# cert=/etc/letsencrypt/live/turn.voxly.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.voxly.example.com/privkey.pem
