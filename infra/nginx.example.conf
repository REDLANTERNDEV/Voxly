# Voxly sets its own security headers (CSP, HSTS, X-Frame-Options,
# X-Content-Type-Options, Referrer-Policy) at the application layer, so every
# hosting method gets the same policy and this file does not repeat them.
#
# X-Forwarded-For below is what the application uses to identify clients for
# rate limiting. Keep it set, or per-client limits collapse into one shared
# bucket for every user behind this proxy. It is *replaced* with the address
# nginx saw rather than appended to ($proxy_add_x_forwarded_for): the app trusts
# the leftmost entry, and an appended header would let any client choose it.
#
# Behind Cloudflare or another CDN, restore the visitor's address first with the
# realip module, so $remote_addr is the visitor and not the edge, e.g.:
#     set_real_ip_from <each published Cloudflare range>;
#     real_ip_header CF-Connecting-IP;

map $http_upgrade $voxly_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voxly_connection_upgrade;
        proxy_read_timeout 75s;
    }
}
